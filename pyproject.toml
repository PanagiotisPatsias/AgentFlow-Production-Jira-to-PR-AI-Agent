[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "python-dotenv>=1,<2",
    "requests>=2,<3",
    "openai>=2,<3",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "psycopg[binary,pool]>=3,<4",
    "SQLAlchemy>=2,<3",
    "alembic>=1,<2",
    "celery[redis]>=5.6,<6",
    "redis>=5,<7",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
